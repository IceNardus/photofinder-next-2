name: Build Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-tauri:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download models
        shell: bash
        run: |
          mkdir -p models
          if [ ! -f models/w600k_r50.onnx ]; then
            echo "Downloading models from release..."
            curl -L -o /tmp/models.tar.gz "https://github.com/IceNardus/photofinder-next-2/releases/download/v0.1.0-models/models.tar.gz"
            tar -xzf /tmp/models.tar.gz -C .
            echo "Models downloaded successfully"
          fi

      - name: Download icons
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          ICONS_DIR="apps/desktop/src-tauri/icons"
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/icon.ico" -o "$ICONS_DIR/icon.ico" || true
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/Square107x107Logo.png" -o "$ICONS_DIR/Square107x107Logo.png" || true
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/Square142x142Logo.png" -o "$ICONS_DIR/Square142x142Logo.png" || true
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/Square150x150Logo.png" -o "$ICONS_DIR/Square150x150Logo.png" || true
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/Square284x284Logo.png" -o "$ICONS_DIR/Square284x284Logo.png" || true
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/Square30x30Logo.png" -o "$ICONS_DIR/Square30x30Logo.png" || true
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/Square310x310Logo.png" -o "$ICONS_DIR/Square310x310Logo.png" || true
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/Square44x44Logo.png" -o "$ICONS_DIR/Square44x44Logo.png" || true
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/Square71x71Logo.png" -o "$ICONS_DIR/Square71x71Logo.png" || true
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/Square89x89Logo.png" -o "$ICONS_DIR/Square89x89Logo.png" || true
          curl -sLO "https://raw.githubusercontent.com/IceNardus/photofinder-next/main/src-tauri/icons/StoreLogo.png" -o "$ICONS_DIR/StoreLogo.png" || true

      - name: Install system deps (ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install system deps (macos)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install pkg-config openssl

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build Tauri
        run: |
          case "${{ matrix.platform }}" in
            macos-latest) cargo tauri build --bundles dmg,app ;;
            windows-latest) cargo tauri build --bundles nsis,msi ;;
            ubuntu-latest) cargo tauri build --bundles deb,appimage ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            target/release/bundle/**
            models/
