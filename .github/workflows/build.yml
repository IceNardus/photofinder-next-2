name: Build Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-tauri:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download models
        shell: bash
        run: |
          mkdir -p models
          if [ ! -f models/w600k_r50.onnx ]; then
            echo "Downloading models from release..."
            curl -L -o /tmp/models.tar.gz "https://github.com/IceNardus/photofinder-next-2/releases/download/v0.1.0-models/models.tar.gz"
            tar -xzf /tmp/models.tar.gz -C models
            echo "Models downloaded successfully"
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Install system deps (ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install system deps (macos)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install pkg-config openssl

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build Tauri (macOS)
        if: matrix.platform == 'macos-latest'
        run: cargo tauri build --bundles dmg,app

      - name: Build Tauri (Windows)
        if: matrix.platform == 'windows-latest'
        run: cargo tauri build --bundles nsis,msi

      - name: Build Tauri (Ubuntu)
        if: matrix.platform == 'ubuntu-latest'
        run: cargo tauri build --bundles deb,appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: |
            target/release/bundle/**
            models/
