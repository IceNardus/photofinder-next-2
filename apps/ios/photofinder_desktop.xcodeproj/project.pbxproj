		0FCDE990F5F8FC9E39C346D0 /* Build libpf_ios_bridge.a staticlib */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Build libpf_ios_bridge.a staticlib";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(DERIVED_FILE_DIR)/build-pf_ios_bridge.marker",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Build the Rust staticlib for the active iOS target before xcodebuild\n# links. The pre-compiled .a lands in a target/ios-active/$(CONFIGURATION)/\n# path shared by both device + sim, so the Xcode linker's\n# LIBRARY_SEARCH_PATHS stack can reference a single stable path\n# regardless of which SDK is active.\nset -e\necho \"[build-pf_ios_bridge] SRCROOT=$SRCROOT EFFECTIVE_PLATFORM_NAME=$EFFECTIVE_PLATFORM_NAME CONFIGURATION=$CONFIGURATION\"\ncase \"$EFFECTIVE_PLATFORM_NAME\" in\n  *iphonesimulator*)\n    TARGET=\"aarch64-apple-ios-sim\"\n    ;;\n  *iphoneos*)\n    TARGET=\"aarch64-apple-ios\"\n    ;;\n  *)\n    echo \"[build-pf_ios_bridge] unknown EFFECTIVE_PLATFORM_NAME=$EFFECTIVE_PLATFORM_NAME — defaulting to aarch64-apple-ios-sim\"\n    TARGET=\"aarch64-apple-ios-sim\"\n    ;;\nesac\nACTIVE_DIR=\"$SRCROOT/../../target/ios-active/$CONFIGURATION/$EFFECTIVE_PLATFORM_NAME\"\nmkdir -p \"$ACTIVE_DIR\"\nACTIVE_LIB=\"$ACTIVE_DIR/libpf_ios_bridge.a\"\nNATIVE_DIR=\"$SRCROOT/../../target/$TARGET/$CONFIGURATION\"\nNATIVE_LIB=\"$NATIVE_DIR/libpf_ios_bridge.a\"\nif [ -f \"$ACTIVE_LIB\" ] && [ \"$SRCROOT/Sources/photofinder_desktop/pf_ios_shim.c\" -ot \"$ACTIVE_LIB\" ]; then\n  echo \"[build-pf_ios_bridge] staticlib up-to-date at $ACTIVE_LIB\"\nelse\n  mkdir -p \"$NATIVE_DIR\"\n  echo \"[build-pf_ios_bridge] cargo build --target $TARGET -p pf_ios_bridge\"\n  (cd \"$SRCROOT/../..\" && cargo build --target \"$TARGET\" -p pf_ios_bridge)\n  # Copy (not symlink — Xcode's linker doesn't always follow symlinks\n  # in staticlib resolution) into the shared path.\n  cp \"$NATIVE_LIB\" \"$ACTIVE_LIB\"\n  echo \"[build-pf_ios_bridge] copied to $ACTIVE_LIB\"\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

