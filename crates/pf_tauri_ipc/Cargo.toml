[package]
name = "pf_tauri_ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PhotoFinder Next 2 — Tauri IPC 共享层（commands + DTO + state）"

[lib]
name = "pf_tauri_ipc"
path = "src/lib.rs"

[dependencies]
# 我们的 crate
pf_core = { workspace = true }
pf_database = { workspace = true }
pf_platform = { workspace = true }
pf_application = { workspace = true }
pf_task = { workspace = true }
pf_config = { workspace = true }
pf_vector = { workspace = true }

# 外部
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
base64 = "0.22"
parking_lot = { workspace = true }

[lints.clippy]
disallowed_methods = "deny"
